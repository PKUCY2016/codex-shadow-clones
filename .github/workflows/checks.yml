name: macOS checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -p 'test_shadow*.py' -v
      - name: Compile and verify the native menu application
        run: |
          python build_menubar.py
          swiftc -module-cache-path .runtime/swift-cache shadow_reload.swift -o .runtime/shadow-reload-check
          swiftc -module-cache-path .runtime/swift-cache shadow_focus.swift -o .runtime/shadow-focus-check
